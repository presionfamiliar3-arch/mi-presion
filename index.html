<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4f8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mi Presión</title>
<style>
:root{--az:#0b4f8a;--bg:#f3f6fa;--tx:#1b2430;--gr:#5d6b7a;--ln:#d7dee6;--ok:#1e7e34;--am:#b7791f;--rj:#b00020}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:18px;padding-bottom:40px}
header{background:var(--az);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0}
header button{background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer}
#barra{padding:10px 16px;font-size:15px;cursor:pointer;background:#e4e9ef;color:var(--tx)}
#barra.ok{background:#d9f0de;color:#14532d}#barra.pend{background:#fff3cd;color:#7a5a00}#barra.err{background:#ffd9d9;color:#7a0012}#barra.sync{background:#dbe9f8;color:#0b3a66}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:19px;margin:0 0 10px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:16px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--ln);border-radius:10px;background:#fff}
.fila{display:flex;gap:10px}.fila>div{flex:1}
.btn{display:block;width:100%;padding:14px;font:inherit;font-weight:700;border:0;border-radius:12px;background:var(--az);color:#fff;cursor:pointer;margin-top:12px}
.btn.sec{background:#fff;color:var(--az);border:2px solid var(--az)}
.btn.rj{background:var(--rj)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 12px;border:2px solid var(--ln);border-radius:20px;background:#fff;font-size:16px;cursor:pointer;user-select:none}
.chip.on{border-color:var(--az);background:#dbe9f8;font-weight:700}
.animos .chip{flex:1;text-align:center;padding:10px 4px;font-size:14px}
.reg{border-left:6px solid var(--ln)}
.reg .val{font-size:26px;font-weight:800}
.reg small{color:var(--gr);display:block}
.reg .acc{display:flex;gap:8px;margin-top:8px}
.reg .acc button{flex:1;padding:8px;font:inherit;font-size:15px;border:1px solid var(--ln);background:#fff;border-radius:8px;cursor:pointer}
.c-n{border-color:#2e9d4a}.c-e{border-color:#d4b106}.c-1{border-color:#e8821a}.c-2{border-color:#d9441f}.c-m{border-color:var(--rj);background:#fff5f5}
.etq{display:inline-block;font-size:14px;padding:2px 8px;border-radius:10px;background:#eee;margin-top:4px}
.vacio{text-align:center;color:var(--gr);padding:20px}
.oculto{display:none!important}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
#modal .caja{background:#fff;border-radius:14px;padding:20px;max-width:440px;width:100%}
#modal h3{margin:0 0 10px;color:var(--rj)}
.nota{font-size:14px;color:var(--gr);margin-top:6px}
</style>
</head>
<body>
<header><h1>❤️ Mi Presión</h1><button id="bAjustes" aria-label="Ajustes">⚙️</button></header>
<div id="barra">Sin conectar a la hoja de Google</div>
<main>
<section id="vInicio">
  <button class="btn" id="bNuevo">➕ Registrar presión</button>
  <div id="resumen" class="card" style="margin-top:14px"></div>
  <h2>Historial</h2>
  <div id="lista"></div>
</section>

<section id="vForm" class="oculto">
  <div class="card">
    <h2 id="tituloForm">Registrar presión</h2>
    <div class="fila">
      <div><label for="fS">Número de arriba (sistólica)</label><input id="fS" type="number" inputmode="numeric" min="1" max="400" placeholder="120"></div>
      <div><label for="fD">Número de abajo (diastólica)</label><input id="fD" type="number" inputmode="numeric" min="1" max="400" placeholder="80"></div>
    </div>
    <label for="fP">Pulso (latidos por minuto)</label>
    <input id="fP" type="number" inputmode="numeric" min="1" max="400" placeholder="70">
    <label>Ánimo</label>
    <div class="chips animos" id="animos"></div>
    <label>Síntomas</label>
    <div class="chips" id="sintomas"></div>
    <label for="fN">Nota (opcional)</label>
    <textarea id="fN" rows="2" maxlength="500"></textarea>
    <label for="fF">Fecha y hora de la medición</label>
    <input id="fF" type="datetime-local">
    <label>¿Quién registra?</label>
    <div class="chips" id="quien"></div>
    <div id="errForm" style="color:var(--rj);font-weight:700;margin-top:10px"></div>
    <button class="btn" id="bGuardar">💾 Guardar</button>
    <button class="btn sec" id="bCancelar">Cancelar</button>
  </div>
</section>

<section id="vAjustes" class="oculto">
  <div class="card">
    <h2>Conexión con la hoja de Google</h2>
    <label for="aUrl">Dirección del script (termina en /exec)</label>
    <input id="aUrl" type="url" autocapitalize="off" autocomplete="off">
    <label for="aCod">Código familiar</label>
    <input id="aCod" type="text" autocapitalize="off" autocomplete="off">
    <label for="aPac">Nombre del paciente</label>
    <input id="aPac" type="text">
    <label for="aPer">Personas que registran (separadas por coma)</label>
    <input id="aPer" type="text" placeholder="Ana, Luis, Marta">
    <label for="aHoja">Enlace de la hoja de Google (opcional)</label>
    <input id="aHoja" type="url" autocapitalize="off">
    <label for="aDisp">Nombre de este celular</label>
    <input id="aDisp" type="text" placeholder="Celular de Ana">
    <div id="msgAj" style="margin-top:10px;font-weight:700"></div>
    <button class="btn" id="bProbar">Probar y guardar conexión</button>
    <button class="btn sec" id="bCompartir">Compartir enlace de configuración</button>
    <button class="btn sec" id="bHoja">Abrir la hoja de Google</button>
    <button class="btn sec" id="bVolver">Volver</button>
    <button class="btn rj" id="bOlvidar">Olvidar datos de este celular</button>
    <p class="nota">Esta aplicación registra y muestra información. No diagnostica ni reemplaza la consulta médica.</p>
  </div>
</section>
</main>
<div id="modal" class="oculto"><div class="caja" id="modalCaja"></div></div>

<script>
(function(){
'use strict';
var SINT={dolor_cabeza:'Dolor de cabeza',mareo:'Mareo',cansancio:'Cansancio',palpitaciones:'Palpitaciones',falta_aire:'Falta de aire',dolor_pecho:'Dolor de pecho',vision_borrosa:'Visión borrosa',nauseas:'Náuseas',dolor_cuello:'Dolor de cuello',hormigueo:'Hormigueo',ninguno:'Ninguno'};
var ANIMOS=['Muy mal','Mal','Regular','Bien','Muy bien'];
var K='mipresion.v1';
var $=function(id){return document.getElementById(id)};
var S={cfg:{url:'',cod:'',pac:'',per:[],hoja:'',disp:''},regs:{},pend:{},ultSync:0};
var F={id:null,animo:null,sint:{},quien:''};
var sincronizando=false,estadoBarra='';

function cargar(){try{var j=JSON.parse(localStorage.getItem(K));if(j){S=j;S.cfg=S.cfg||{};S.regs=S.regs||{};S.pend=S.pend||{}}}catch(e){}}
function guardarLocal(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function conectado(){return !!(S.cfg.url&&S.cfg.cod)}
function vista(n){['vInicio','vForm','vAjustes'].forEach(function(v){$(v).classList.toggle('oculto',v!==n)});window.scrollTo(0,0)}

/* ---------- clasificación (misma lógica del script) ---------- */
function clasif(s,d){
  if(s>180||d>120)return{t:'Muy alta (rango de crisis)',c:'c-m'};
  if(s>=140||d>=90)return{t:'Alta (etapa 2)',c:'c-2'};
  if(s>=130||d>=80)return{t:'Alta (etapa 1)',c:'c-1'};
  if(s>=120)return{t:'Elevada',c:'c-e'};
  return{t:'Normal',c:'c-n'};
}
function necesitaAlerta(r){return r.sistolica>180||r.diastolica>120||(r.sintomas||[]).indexOf('dolor_pecho')>=0||(r.sintomas||[]).indexOf('falta_aire')>=0}

/* ---------- barra de estado ---------- */
function pintarBarra(){
  var b=$('barra'),n=Object.keys(S.pend).length;
  if(!conectado()){b.className='';b.textContent='Sin conectar a la hoja de Google. Toque aquí para configurar.';return}
  if(sincronizando){b.className='sync';b.textContent='🔄 Sincronizando…';return}
  if(estadoBarra){b.className='err';b.textContent=estadoBarra;return}
  if(n){b.className='pend';b.textContent='⏳ '+n+' pendiente(s) de enviar. Toque para reintentar.';return}
  b.className='ok';b.textContent='✅ Guardado en la hoja de Google';
}
$('barra').onclick=function(){if(!conectado())abrirAjustes();else sincronizar()};

/* ---------- red ---------- */
function post(registro){
  return fetch(S.cfg.url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({codigo:S.cfg.cod,accion:'guardar',registro:registro})}).then(function(r){return r.json()});
}
function get(params){
  var u=S.cfg.url+(S.cfg.url.indexOf('?')<0?'?':'&')+params;
  return fetch(u,{redirect:'follow'}).then(function(r){return r.json()});
}
function errTexto(e){
  if(e&&e.error==='codigo')return'❌ El código familiar no coincide. Revíselo en Ajustes.';
  return'❌ La dirección del script no responde bien. Revísela en Ajustes.';
}

function sincronizar(){
  if(!conectado()||sincronizando){pintarBarra();return Promise.resolve()}
  if(!navigator.onLine){pintarBarra();return Promise.resolve()}
  sincronizando=true;estadoBarra='';pintarBarra();
  var ids=Object.keys(S.pend);
  var cadena=Promise.resolve();
  ids.forEach(function(id){
    cadena=cadena.then(function(){
      var r=S.regs[id];if(!r){delete S.pend[id];return}
      return post(r).then(function(res){
        if(res&&res.ok){delete S.pend[id];guardarLocal()}
        else throw res||{};
      });
    });
  });
  return cadena.then(function(){return get('accion=listar&codigo='+encodeURIComponent(S.cfg.cod))})
  .then(function(res){
    if(!res||!res.ok)throw res||{};
    var remotos={};
    res.registros.forEach(function(r){remotos[r.id]=r;
      var l=S.regs[r.id];
      if(S.pend[r.id])return;
      if(!l||String(r.rev)>String(l.rev))S.regs[r.id]=r;
    });
    Object.keys(S.regs).forEach(function(id){if(!S.pend[id]&&!remotos[id])delete S.regs[id]});
    S.ultSync=Date.now();guardarLocal();
  }).catch(function(e){
    estadoBarra=(e&&e.error)?errTexto(e):'';
  }).then(function(){sincronizando=false;pintarBarra();pintarInicio()});
}

/* ---------- inicio ---------- */
function activos(){return Object.keys(S.regs).map(function(i){return S.regs[i]}).filter(function(r){return r.estado==='Activo'}).sort(function(a,b){return new Date(b.fechaHora)-new Date(a.fechaHora)})}
function fmt(iso){var d=new Date(iso);return d.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}
function prom(dias){
  var lim=Date.now()-dias*86400000,a=activos().filter(function(r){return new Date(r.fechaHora).getTime()>=lim});
  if(!a.length)return'-';
  var m=function(k){return Math.round(a.reduce(function(s,r){return s+r[k]},0)/a.length)};
  return m('sistolica')+'/'+m('diastolica')+' (pulso '+m('pulso')+')';
}
function pintarInicio(){
  var a=activos();
  $('resumen').innerHTML='<h2>'+esc(S.cfg.pac||'Resumen')+'</h2>'+
    '<div>Mediciones: <b>'+a.length+'</b></div>'+
    '<div>Promedio 7 días: <b>'+prom(7)+'</b></div>'+
    '<div>Promedio 30 días: <b>'+prom(30)+'</b></div>';
  if(!a.length){$('lista').innerHTML='<div class="vacio">Aún no hay registros.</div>';return}
  $('lista').innerHTML=a.map(function(r){
    var c=clasif(r.sistolica,r.diastolica);
    var s=(r.sintomas||[]).map(function(k){return SINT[k]}).filter(Boolean).join(', ');
    return '<div class="card reg '+c.c+'"><div class="val">'+r.sistolica+'/'+r.diastolica+' <span style="font-size:16px;font-weight:600">pulso '+r.pulso+'</span></div>'+
      '<span class="etq">'+esc(c.t)+'</span>'+
      '<small>'+esc(fmt(r.fechaHora))+' · '+esc(r.quien)+(S.pend[r.id]?' · ⏳ pendiente':'')+'</small>'+
      (r.estadoAnimo?'<small>Ánimo: '+esc(ANIMOS[r.estadoAnimo-1])+'</small>':'')+
      (s?'<small>Síntomas: '+esc(s)+'</small>':'')+
      (r.nota?'<small>Nota: '+esc(r.nota)+'</small>':'')+
      '<div class="acc"><button data-ed="'+esc(r.id)+'">✏️ Corregir</button><button data-bo="'+esc(r.id)+'">🗑️ Borrar</button></div></div>';
  }).join('');
}
$('lista').onclick=function(e){
  var t=e.target;
  if(t.dataset.ed)abrirForm(t.dataset.ed);
  if(t.dataset.bo)borrar(t.dataset.bo);
};

/* ---------- formulario ---------- */
function ahoraLocal(d){d=d||new Date();var p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function pintarChips(){
  $('animos').innerHTML=ANIMOS.map(function(n,i){return '<div class="chip'+(F.animo===i+1?' on':'')+'" data-a="'+(i+1)+'">'+(i+1)+'<br>'+n+'</div>'}).join('');
  $('sintomas').innerHTML=Object.keys(SINT).map(function(k){return '<div class="chip'+(F.sint[k]?' on':'')+'" data-s="'+k+'">'+SINT[k]+'</div>'}).join('');
  $('quien').innerHTML=(S.cfg.per||[]).map(function(n){return '<div class="chip'+(F.quien===n?' on':'')+'" data-q="'+esc(n)+'">'+esc(n)+'</div>'}).join('')||'<span class="nota">Agregue los nombres en Ajustes.</span>';
}
$('animos').onclick=function(e){var a=e.target.closest('[data-a]');if(!a)return;var v=+a.dataset.a;F.animo=F.animo===v?null:v;pintarChips()};
$('sintomas').onclick=function(e){var s=e.target.closest('[data-s]');if(!s)return;var k=s.dataset.s;
  if(k==='ninguno'){F.sint=F.sint.ninguno?{}:{ninguno:true}}else{delete F.sint.ninguno;F.sint[k]=!F.sint[k];if(!F.sint[k])delete F.sint[k]}
  pintarChips()};
$('quien').onclick=function(e){var q=e.target.closest('[data-q]');if(!q)return;F.quien=q.dataset.q;pintarChips()};

function abrirForm(id){
  F={id:id||null,animo:null,sint:{},quien:''};
  $('errForm').textContent='';
  if(id&&S.regs[id]){
    var r=S.regs[id];
    $('tituloForm').textContent='Corregir registro';
    $('fS').value=r.sistolica;$('fD').value=r.diastolica;$('fP').value=r.pulso;$('fN').value=r.nota||'';
    $('fF').value=ahoraLocal(new Date(r.fechaHora));
    F.animo=r.estadoAnimo||null;(r.sintomas||[]).forEach(function(k){F.sint[k]=true});F.quien=r.quien;
  }else{
    $('tituloForm').textContent='Registrar presión';
    $('fS').value='';$('fD').value='';$('fP').value='';$('fN').value='';$('fF').value=ahoraLocal();
  }
  pintarChips();vista('vForm');
}
$('bNuevo').onclick=function(){abrirForm()};
$('bCancelar').onclick=function(){vista('vInicio')};

function nuevaRev(prev){
  var n=Date.now();if(prev&&+prev>=n)n=+prev+1;
  return String(n).padStart(13,'0');
}
function idNuevo(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

$('bGuardar').onclick=function(){
  var s=parseInt($('fS').value,10),d=parseInt($('fD').value,10),p=parseInt($('fP').value,10);
  var err='';
  if(!(s>=1&&s<=400))err='Escriba el número de arriba (entre 1 y 400).';
  else if(!(d>=1&&d<=400))err='Escriba el número de abajo (entre 1 y 400).';
  else if(!(p>=1&&p<=400))err='Escriba el pulso (entre 1 y 400).';
  else if(!$('fF').value||isNaN(new Date($('fF').value).getTime()))err='Elija la fecha y la hora.';
  else if(!F.quien)err='Toque su nombre en "¿Quién registra?".';
  else if(d>=s)err='El número de abajo debe ser menor que el de arriba. Revise los valores.';
  if(err){$('errForm').textContent=err;return}
  var prev=F.id?S.regs[F.id]:null;
  var r={
    id:F.id||idNuevo(),rev:nuevaRev(prev&&prev.rev),
    fechaHora:new Date($('fF').value).toISOString(),quien:F.quien,
    sistolica:s,diastolica:d,pulso:p,
    estadoAnimo:F.animo,sintomas:Object.keys(F.sint).filter(function(k){return F.sint[k]}),
    nota:$('fN').value.trim(),dispositivo:S.cfg.disp||'',estado:'Activo'
  };
  S.regs[r.id]=r;S.pend[r.id]=true;guardarLocal();
  vista('vInicio');pintarInicio();pintarBarra();
  if(necesitaAlerta(r))avisoEmergencia(r);
  sincronizar();
};

function borrar(id){
  var r=S.regs[id];if(!r)return;
  if(!confirm('¿Borrar la medición '+r.sistolica+'/'+r.diastolica+' del '+fmt(r.fechaHora)+'?'))return;
  r.estado='Eliminado';r.rev=nuevaRev(r.rev);r.dispositivo=S.cfg.disp||r.dispositivo;
  S.pend[id]=true;guardarLocal();pintarInicio();pintarBarra();sincronizar();
}

function avisoEmergencia(r){
  var c=clasif(r.sistolica,r.diastolica);
  var tieneSint=(r.sintomas||[]).some(function(k){return k==='dolor_pecho'||k==='falta_aire'});
  $('modalCaja').innerHTML='<h3>⚠️ Atención</h3><p><b>'+r.sistolica+'/'+r.diastolica+'</b> · '+esc(c.t)+'</p>'+
    '<p>'+(tieneSint?'Hay síntomas que requieren atención. ':'')+'Si hay dolor de pecho, falta de aire o debilidad repentina, busque atención médica de inmediato o llame a la línea de emergencias <b>123</b>.</p>'+
    '<p class="nota">Este mensaje es informativo y no es un diagnóstico.</p>'+
    '<button class="btn" id="mOk">Entendido</button>';
  $('modal').classList.remove('oculto');
  $('mOk').onclick=function(){$('modal').classList.add('oculto')};
}

/* ---------- ajustes ---------- */
function abrirAjustes(){
  var c=S.cfg;
  $('aUrl').value=c.url||'';$('aCod').value=c.cod||'';$('aPac').value=c.pac||'';
  $('aPer').value=(c.per||[]).join(', ');$('aHoja').value=c.hoja||'';$('aDisp').value=c.disp||'';
  $('msgAj').textContent='';vista('vAjustes');
}
$('bAjustes').onclick=abrirAjustes;
$('bVolver').onclick=function(){vista('vInicio');pintarInicio()};
function leerAjustes(){
  return{url:$('aUrl').value.trim(),cod:$('aCod').value.trim(),pac:$('aPac').value.trim(),
    per:$('aPer').value.split(',').map(function(x){return x.trim()}).filter(Boolean),
    hoja:$('aHoja').value.trim(),disp:$('aDisp').value.trim()};
}
$('bProbar').onclick=function(){
  var c=leerAjustes(),m=$('msgAj');
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(c.url)){m.style.color='#b00020';m.textContent='La dirección debe empezar por https://script.google.com y terminar en /exec (sin /u/0/ ni /u/3/).';return}
  if(!c.cod){m.style.color='#b00020';m.textContent='Escriba el código familiar.';return}
  m.style.color='#5d6b7a';m.textContent='Probando…';
  var u=c.url+'?accion=listar&codigo='+encodeURIComponent(c.cod);
  fetch(u,{redirect:'follow'}).then(function(r){return r.json()}).then(function(res){
    if(res&&res.ok){S.cfg=c;guardarLocal();m.style.color='#1e7e34';m.textContent='✅ Conexión correcta';estadoBarra='';sincronizar()}
    else{m.style.color='#b00020';m.textContent=errTexto(res)}
  }).catch(function(){m.style.color='#b00020';m.textContent='❌ La dirección del script no responde bien. Revise que termine en /exec y que el acceso sea "Cualquier persona".'});
};
$('bCompartir').onclick=function(){
  var c=S.cfg;if(!conectado()){$('msgAj').textContent='Primero guarde la conexión.';return}
  var datos={url:c.url,cod:c.cod,pac:c.pac,per:c.per,hoja:c.hoja};
  var b64=btoa(unescape(encodeURIComponent(JSON.stringify(datos)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  var enlace=location.origin+location.pathname+'#cfg='+b64;
  var texto='Configuración de Mi Presión (solo para la familia): '+enlace;
  if(navigator.share){navigator.share({title:'Mi Presión',text:texto}).catch(function(){})}
  else if(navigator.clipboard){navigator.clipboard.writeText(enlace).then(function(){$('msgAj').textContent='Enlace copiado. Péguelo en WhatsApp.'})}
  else prompt('Copie este enlace:',enlace);
};
$('bHoja').onclick=function(){if(S.cfg.hoja)window.open(S.cfg.hoja,'_blank');else{$('msgAj').style.color='#b00020';$('msgAj').textContent='No hay enlace de la hoja guardado.'}};
$('bOlvidar').onclick=function(){
  if(!confirm('Se borrarán los registros guardados en este celular (no los de la hoja). Los pendientes de enviar se perderán. ¿Continuar?'))return;
  S.regs={};S.pend={};guardarLocal();pintarInicio();sincronizar();$('msgAj').textContent='Datos locales borrados.';
};

/* ---------- enlace de configuración ---------- */
function leerHash(){
  var m=location.hash.match(/^#cfg=([\w-]+)/);if(!m)return;
  try{
    var b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    var d=JSON.parse(decodeURIComponent(escape(atob(b))));
    if(d&&d.url&&d.cod){
      S.cfg.url=String(d.url);S.cfg.cod=String(d.cod);S.cfg.pac=String(d.pac||'');
      S.cfg.per=Array.isArray(d.per)?d.per.map(String):[];S.cfg.hoja=String(d.hoja||'');
      guardarLocal();
      history.replaceState(null,'',location.pathname);
      alert('✅ Configuración recibida. Ahora escriba el nombre de este celular en Ajustes.');
      abrirAjustes();return true;
    }
  }catch(e){}
}

/* ---------- inicio ---------- */
cargar();
var vino=leerHash();
pintarBarra();pintarInicio();
if(!vino&&!conectado())abrirAjustes();
window.addEventListener('online',sincronizar);
document.addEventListener('visibilitychange',function(){if(!document.hidden)sincronizar()});
if(conectado())sincronizar();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
